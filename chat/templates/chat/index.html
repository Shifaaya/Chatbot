<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My AI Chatbot</title>
    

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .chat-container {
            width: 500px;
            height: 650px;

            background: white;
            border-radius: 12px;

            display: flex;
            flex-direction: column;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .chat-header {
            padding: 18px;
            background: #4f46e5;
            color: white;

            font-size: 20px;
            font-weight: bold;
        }

        #chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 12px;
            padding: 10px 14px;

            border-radius: 10px;
            max-width: 80%;
            line-height: 1.4;
        }

        .user-message {
            margin-left: auto;
            background: #e0e7ff;
        }

        .bot-message {
            margin-right: auto;
            background: #f1f1f1;
        }

        .input-area {
            display: flex;
            padding: 12px;
            border-top: 1px solid #ddd;
        }

        #message-input {
            flex: 1;

            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 15px;
        }

        #send-button {
            margin-left: 10px;
            padding: 12px 18px;

            border: none;
            border-radius: 8px;

            background: #4f46e5;
            color: white;

            cursor: pointer;
        }

        #send-button:hover {
            background: #4338ca;
        }
        #clear-chat {
            margin-left: 247px;
            padding: 12px 18px;

            border: none;
            border-radius: 8px;

            background: white;
            color:  #4f46e5;

            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <div class="chat-header">
            My ChatBot

        
        <button id="clear-chat">Clear Chat</button>

        </div>


        <div id="chat-box">
        </div>

        <div class="input-area">

            <input
                type="text"
                id="message-input"
                placeholder="Type a message..."
            >

            <button id="send-button">
                Send
            </button>

        </div>

    </div>


    <script>

        const input = document.getElementById("message-input");
        const button = document.getElementById("send-button");
        const chatBox = document.getElementById("chat-box");


        button.addEventListener("click", async () => {

            const message = input.value.trim();

            if (!message) {
                return;
            }


            chatBox.innerHTML += `
                <div class="message user-message">
                    <strong>You:</strong> ${message}
                </div>
            `;


            input.value = "";


            const response = await fetch(
                `/chat/?message=${encodeURIComponent(message)}`
            );


            const data = await response.json();


            chatBox.innerHTML += `
                <div class="message bot-message">
                    <strong>Bot:</strong> ${data.message}
                </div>
            `;


            chatBox.scrollTop = chatBox.scrollHeight;

        });

    
    document.getElementById("clear-chat").addEventListener("click", async () => {
    try {
        const response = await fetch("/clear-chat/", {
            method: "POST",
            headers: {
                "X-CSRFToken": getCookie("csrftoken")
            }
        });

        const data = await response.json();

        if (response.ok) {
            chatBox.innerHTML = "";
         } else {
            alert("Unable to clear chat.");
        }
    } catch (error) {
        console.error("Clear chat failed:", error);
        alert("Something went wrong while clearing the chat.");
    }
});

function getCookie(name) {
    const cookies = document.cookie.split(";");

    for (const cookie of cookies) {
        const trimmedCookie = cookie.trim();

        if (trimmedCookie.startsWith(name + "=")) {
            return decodeURIComponent(trimmedCookie.substring(name.length + 1));
        }
    }

    return "";
}


    </script>

</body>
</html>
